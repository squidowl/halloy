name: Build

on:
  pull_request:
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
  merge_group:
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@master # recommended when specifying toolchain
        with:
          toolchain: nightly
          components: rustfmt

      - run: cargo +nightly fmt --all -- --check --color=always

  build-clippy-test:
    name: Build, Clippy, & Test

    strategy:
      fail-fast: false
      matrix:
        target:
          - target: macos
            os: macos-latest
            rustflags: ""
          - target: windows
            os: windows-latest
            rustflags: ""
          - target: linux
            os: ubuntu-latest
            rustflags: "-C linker=clang -C link-arg=-fuse-ld=mold"

    runs-on: ${{ matrix.target.os }}
    env:
      RUSTFLAGS: ${{ matrix.target.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        if: matrix.target.target == 'linux'
        run: |
          sudo apt update
          sudo apt install $(cat .github/linux-deps.txt) git mold clang

      - uses: dtolnay/rust-toolchain@master # recommended when specifying toolchain
        with:
          toolchain: stable minus 3 releases
          components: clippy
          # Intel macOS is cross-checked on Apple Silicon (as shipped in the universal binary).
          targets: ${{ matrix.target.target == 'macos' && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug-${{ matrix.target.target }}
          # PR caches can't be restored by other branches and evict main's
          # caches from the 10 GB repository limit. PRs still restore from main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo version
      - name: Clippy
        run: cargo clippy --locked --profile ci --workspace --all-targets -- -D warnings
      - name: Clippy (x86_64-apple-darwin)
        if: matrix.target.target == 'macos'
        run: cargo clippy --locked --profile ci --workspace --all-targets --target x86_64-apple-darwin -- -D warnings

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run --locked --profile ci --workspace --all-targets
