version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "main"
    groups:
      rust-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # v3 submits to SignPath's new Pipeline Connector, which rejects our
      # signing requests. Stay on v2 until that is resolved.
      - dependency-name: "signpath/github-action-submit-signing-request"
        update-types: ["version-update:semver-major"]
