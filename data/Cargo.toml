[package]
name = "data"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "data"
path = "src/lib.rs"

[features]
tor = ["irc/tor"]
message_tests = ["iced/tokio"]

[dependencies]
hashbrown = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["io-util", "fs", "rt"] }
jiff = { workspace = true }
bytes = { workspace = true }
strum = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
tokio-stream = { workspace = true, features = ["time", "fs"] }
itertools = { workspace = true }
emojis = { workspace = true }
unicode-segmentation = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
palette = { workspace = true }
log = { workspace = true }
nucleo-matcher = { workspace = true }
reqwest = { workspace = true }
tokio-util = { workspace = true }
const_format = { workspace = true }
iced = { workspace = true, features = [
    "sysinfo",
    "tokio",
    "wayland",
] }
nom = { workspace = true }
percent-encoding = { workspace = true }
image = { workspace = true }
dirs = { workspace = true }
keyring-core = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

equivalent = "1.0"
base64 = "0.23.0"
xdg = "3.0.0"
flate2 = "1.0"
hex = "0.4.3"
iced_core = "0.15.0-dev"
iced_wgpu = "0.15.0-dev"
indexmap = { version = "2.14", features = ["std", "serde"] }
seahash = "4.1.0"
serde_json = "1.0"
serde_ignored = "0.1"
serde-untagged = "0.1"
sha2 = "0.11.0"
toml = { version = "1.1.4", features = ["preserve_order"] }
fancy-regex = "0.20"
walkdir = "2.5.0"
derive_more = { version = "2.0.1", features = ["full"] }
gif = "0.14.1"
html-escape = "0.3.0"
display-info = "0.5.9"
infer = "0.22"
mime_guess = "2.0.5"
any_ascii = "0.3.3"
idna = "1.1.0"
unicode-security = "0.1.2"
version-compare = "0.2"
sanitize-filename = "0.6.0"
jiff-icu = "0.2"
icu_locale = { version = "2.4", features = ["serde"] }
icu_datetime = "2.4"
icu_calendar = "2.4"
icu_time = "2.4"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = [
    "keychain",
] }
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = [
    "rt-tokio-crypto-rust",
] }
zbus-secret-portal-keyring-store = {
    git = "https://github.com/luca020400/zbus-secret-portal-keyring-store",
    rev = "ff61ffb37324055cb6c48f55410726f67a0f08a0",
}

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32"] }

[dev-dependencies]
serde_test = "1.0"
tempfile = "3"

[dependencies.irc]
path = "../irc"

[dependencies.serde]
version = "1.0"
features = ["derive", "rc"]

[lints]
workspace = true
